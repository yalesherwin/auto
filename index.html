<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CHINACNU 价格计算器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: env(safe-area-inset-top) 20px 40px 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #1a73e8;
      padding-top: 20px;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 30px;
      padding: 12px;
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
      white-space: normal; overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>CHINACNU 价格计算器</h1>

  <label>选择产品种类</label>
  <select id="product">
    <option value="彩涂板(新增)">彩涂板(新增)</option>
    <option value="有花镀锌 厚板">有花镀锌 厚板</option>
    <option value="有花镀锌 (薄板)带精包">有花镀锌 (薄板)带精包</option>
    <option value="彩基板">彩基板</option>
    <option value="镀铝锌无耐指纹">镀铝锌无耐指纹</option>
    <option value="彩涂漆膜12-5">彩涂漆膜12-5</option>
    <option value="罩退冷轧卷板">罩退冷轧卷板</option>
    <option value="热卷价格">热卷价格</option>
    <option value="镀锌带钢">镀锌带钢</option>
    <option value="国际型钢">国际型钢</option>
    <option value="中国型钢">中国型钢</option>
  </select>

  <label>厚度 (mm)</label>
  <input type="number" step="0.01" id="thickness" placeholder="例如 0.35">

  <button onclick="calculatePrice()">获取价格</button>

  <div class="result" id="result" style="display:none"></div>

  <h3>输入您的邮箱，接收报价</h3>
  <label>客户邮箱</label>
  <input type="email" id="email" placeholder="客户邮箱">

  <button onclick="sendEmail()">发送报价到邮箱</button>

  <script src="https://cdn.jsdelivr.net/npm/emailjs-com@2.6.4/dist/email.min.js"></script>

  <script>
    emailjs.init('gd39HyL57gtXbqPmy');  // 用您的用户 ID 替换

    async function getMatchingRow(product, thickness) {
      const sheetId = "1L8RGRPI7BdIlDew99K7QIXU5f7llOLqWqskwXb1lms4";
      const sheetName = encodeURIComponent(product);
      const range = "A1:Z100";
      const apiKey = "AIzaSyB-io6C9S0y5I6YXMi9TrDbAx8PkC2ReKo";
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/'${sheetName}'!${range}?key=${apiKey}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.values || data.values.length < 2) return null;

        const headers = data.values[0];
        const rows = data.values.slice(1);
        const thicknessCol = headers.findIndex(h => h.includes("厚度"));

        let closestRow = null;
        let minDiff = Infinity;
        for (let i = 0; i < rows.length; i++) {
          const val = parseFloat(rows[i][thicknessCol]);
          if (!isNaN(val)) {
            const diff = Math.abs(val - thickness);
            if (diff <= 0.01 && diff < minDiff) {
              minDiff = diff;
              closestRow = rows[i];
            }
          }
        }
        return { headers, row: closestRow };
      } catch (e) {
        console.error("加载失败", e);
        return null;
      }
    }

    async function calculatePrice() {
      const product = document.getElementById('product').value;
      const thickness = parseFloat(document.getElementById('thickness').value);
      const data = await getMatchingRow(product, thickness);

      if (!data || !data.row) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = `⚠️ 未找到接近的厚度 ${thickness} 的价格。`;
        return;
      }

      const { headers, row } = data;
      let output = headers.map((h, i) => h.includes('成本') ? null : `<tr><td><strong>${h}</strong></td><td>${row[i]}</td></tr>`).filter(Boolean).join("");
      output = `<table style='width:100%;border-collapse:collapse;'>${output}</table>`;

      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = output;
    }

    function sendEmail() {
      const product = document.getElementById('product').value;
      const thickness = document.getElementById('thickness').value;
      const email = document.getElementById('email').value;
      
      if (!email) {
        alert("请填写邮箱地址");
        return;
      }

      emailjs.send('service_6znq9zl', 'template_nz69gvn', {
        product: product,
        thickness: thickness,
        price_1m_RMB: document.querySelector('#result td:nth-child(2)').textContent,  // 获取价格
        price_1m_USD: document.querySelector('#result td:nth-child(3)').textContent,  // 获取价格
        price_1_2m_RMB: document.querySelector('#result td:nth-child(4)').textContent,  // 获取价格
        price_1_2m_USD: document.querySelector('#result td:nth-child(5)').textContent,  // 获取价格
        email: email
      }, 'gd39HyL57gtXbqPmy')  // 用您的用户 ID 替换
      .then(function(response) {
        alert('报价已发送到您的邮箱！');
      }, function(error) {
        alert('发送失败，请重试。');
      });
    }
  </script>
</body>
</html>
