<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>CHINACNU 价格计算器</title>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/emailjs-com@3.2.0/dist/email.min.js"></script> <!-- 更新SDK版本 -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: env(safe-area-inset-top) 20px 40px 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #1a73e8;
      padding-top: 20px;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
      white-space: normal;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>CHINACNU 价格计算器</h1>

  <label>选择产品种类</label>
  <select id="product">
    <option value="彩涂板(新增)">彩涂板(新增)</option>
    <option value="有花镀锌 厚板">有花镀锌 厚板</option>
    <option value="有花镀锌 (薄板)带精包">有花镀锌 (薄板)带精包</option>
    <option value="彩基板">彩基板</option>
    <option value="镀铝锌无耐指纹">镀铝锌无耐指纹</option>
    <option value="彩涂漆膜12-5">彩涂漆膜12-5</option>
    <option value="罩退冷轧卷板">罩退冷轧卷板</option>
    <option value="热卷价格">热卷价格</option>
    <option value="镀锌带钢">镀锌带钢</option>
    <option value="国际型钢">国际型钢</option>
    <option value="中国型钢">中国型钢</option>
  </select>

  <label>厚度 (mm)</label>
  <input type="number" step="0.01" id="thickness" placeholder="例如 0.35">

  <button onclick="calculatePrice()">获取价格</button>

  <div class="result" id="result" style="display:none"></div>

  <label>客户邮箱</label>
  <input type="email" id="customer_email" placeholder="请输入邮箱">
  <button onclick="sendEmail()">发送报价到邮箱</button>

  <script>
    emailjs.init("gd39HyL57gtXbqPmy"); // 使用您的EmailJS User ID

    async function getMatchingRow(product, thickness) {
      const sheetId = "1L8RGRPI7BdIlDew99K7QIXU5f7llOLqWqskwXb1lms4";
      const sheetName = encodeURIComponent(product);
      const range = "A1:Z100";
      const apiKey = "AIzaSyB-io6C9S0y5I6YXMi9TrDbAx8PkC2ReKo";
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/'${sheetName}'!${range}?key=${apiKey}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        if (!data.values || data.values.length < 2) return null;

        const headers = data.values[0];
        const rows = data.values.slice(1);
        const thicknessCol = headers.findIndex(h => h.includes("厚度"));

        let closestRow = null;
        let minDiff = Infinity;
        for (const row of rows) {
          const val = parseFloat(row[thicknessCol]);
          if (!isNaN(val)) {
            const diff = Math.abs(val - thickness);
            if (diff <= 0.01 && diff < minDiff) {
              minDiff = diff;
              closestRow = row;
            }
          }
        }
        return { headers, row: closestRow };
      } catch (e) {
        console.error("加载失败", e);
        return null;
      }
    }

    let currentData = null;

    async function calculatePrice() {
      const product = document.getElementById('product').value;
      const thickness = parseFloat(document.getElementById('thickness').value);
      const data = await getMatchingRow(product, thickness);

      if (!data || !data.row) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = `⚠️ 未找到接近的厚度 ${thickness} 的价格。`;
        return;
      }

      currentData = { product, thickness, headers: data.headers, row: data.row };

      const { headers, row } = data;
      let output = headers.map((h, i) => h.includes('成本') ? null : `<tr><td><strong>${h}</strong></td><td>${row[i]}</td></tr>`).filter(Boolean).join("");
      output = `<table style='width:100%;border-collapse:collapse;'>${output}</table>`;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = output;
    }

    function sendEmail() {
      if (!currentData) {
        alert("请先获取价格，再发送邮件。");
        return;
      }
      const email = document.getElementById("customer_email").value;
      if (!email.includes("@")) {
        alert("请输入有效邮箱");
        return;
      }

      const content = currentData.headers.map((h, i) => h.includes("成本") ? null : `${h}: ${currentData.row[i]}`).filter(Boolean).join("\n");
      const templateParams = {
        product: currentData.product,
        thickness: currentData.thickness,
        email,
        message: content
      };

      // 发送邮件
      emailjs.send("service_6znq9zl", "template_nz69gvn", templateParams) // 使用您提供的service_id和template_id
        .then(() => alert("邮件已成功发送"))
        .catch(err => {
          console.error(err);
          alert("发送失败，请检查配置");
        });
    }
  </script>
</body>
</html>
