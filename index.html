<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>CHINACNU 价格计算器</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      padding: 40px;
      max-width: 600px;
      margin: auto;
    }
    h1 {
      color: #1a73e8;
    }
    label {
      display: block;
      margin-top: 20px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    button {
      margin-top: 30px;
      padding: 12px;
      width: 100%;
      background: #1a73e8;
      color: white;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    .result {
      margin-top: 30px;
      padding: 20px;
      background: white;
      border: 1px solid #ccc;
    }
    table {
      border-collapse: collapse;
      width: 100%;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #f0f0f0;
    }
  </style>
</head>
<body>
  <h1>CHINACNU 价格计算器</h1>

  <label>选择产品种类</label>
  <select id="product">
    <option value="彩涂板(新增)">彩涂板(新增)</option>
    <option value="有花镀锌 厚板">有花镀锌 厚板</option>
    <option value="有花镀锌 (薄板)带精包">有花镀锌 (薄板)带精包</option>
    <option value="彩基板">彩基板</option>
    <option value="镀铝锌无耐指纹">镀铝锌无耐指纹</option>
    <option value="彩涂漆膜12-5">彩涂漆膜12-5</option>
    <option value="罩退冷轧卷板">罩退冷轧卷板</option>
    <option value="热卷价格">热卷价格</option>
    <option value="镀锌带钢">镀锌带钢</option>
    <option value="国际型钢">国际型钢</option>
    <option value="中国型钢">中国型钢</option>
  </select>

  <label>厚度 (mm)</label>
  <input type="number" step="0.01" id="thickness" placeholder="例如 0.35">

  <button onclick="calculatePrice()">查找所有价格</button>

  <div class="result" id="result" style="display:none"></div>

  <script>
    async function calculatePrice() {
      const product = document.getElementById('product').value;
      const thickness = parseFloat(document.getElementById('thickness').value);

      const sheetId = "1L8RGRPI7BdIlDew99K7QIXU5f7llOLqWqskwXb1lms4";
      const sheetName = encodeURIComponent(product);
      const range = "A1:Z100";
      const apiKey = "AIzaSyB-io6C9S0y5I6YXMi9TrDbAx8PkC2ReKo";
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${sheetId}/values/'${sheetName}'!${range}?key=${apiKey}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        const headers = data.values[0];
        const rows = data.values.slice(1);
        const thicknessCol = headers.findIndex(h => h.includes("厚度"));

        const matchRows = rows.filter(row => {
          const cell = row[thicknessCol];
          if (!cell) return false;
          const val = parseFloat(cell.toString().replace(/[^\d.]/g, ''));
          return Math.abs(val - thickness) < 0.001;
        });

        if (matchRows.length === 0) {
          document.getElementById('result').style.display = 'block';
          document.getElementById('result').innerHTML = `⚠️ 未找到厚度 ${thickness} mm 对应的价格。`;
          return;
        }

        let table = '<table><thead><tr>';
        headers.forEach(h => table += `<th>${h}</th>`);
        table += '</tr></thead><tbody>';

        matchRows.forEach(row => {
          table += '<tr>';
          headers.forEach((_, i) => {
            table += `<td>${row[i] || ''}</td>`;
          });
          table += '</tr>';
        });

        table += '</tbody></table>';
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = table;
      } catch (e) {
        document.getElementById('result').style.display = 'block';
        document.getElementById('result').innerHTML = `❌ 获取数据失败：${e.message}`;
      }
    }
  </script>
</body>
</html>
